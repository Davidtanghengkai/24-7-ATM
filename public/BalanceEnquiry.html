<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Enquiry - 24/7 ATM</title>
    <link rel="stylesheet" type="text/css" href="CSS/index.css">
    <link rel="stylesheet" type="text/css" href="CSS/chat.css">
    <link rel="stylesheet" type="text/css" href="CSS/BalanceEnquiry.css">
</head>

<body>
    <div class="atm-container">
        <div class="top-links">
            <a href="#" class="top-link" id="language-toggle">ENG</a>
            <span class="top-separator">|</span>
            <a href="#" class="top-link" id="exit" translateRef="exitLink">Exit</a>
        </div>

        <div class="balance-wrapper">
            <div class="balance-card">
                <div class="card-header">
                    <h1 id="account-type-display">Savings Account</h1>
                    <p id="account-no-display">Account No: **** **** 1234</p>
                </div>

                <div class="balance-content">
                    <span class="currency-symbol">$</span>
                    <span id="balance-amount" class="balance-amount">0.00</span>
                </div>

                <div class="card-footer">
                    <p>Available Balance</p>
                    <p id="timestamp-display">As of Jan 20, 2026 19:50</p>
                </div>
            </div>

            <div class="action-buttons">
                <button onclick="window.location.href='NewHomePage.html'" class="btn-primary">Perform Another
                    Action</button>
                <button onclick="window.location.href='TransactionCancel.html'" class="btn-secondary">Finish &
                    Exit</button>
            </div>
        </div>
        <div id="chat-toggle" class="chat-icon">
            <span  class="icon-bubble">💬</span>
        </div>

        <div id="chat-root"></div>
    </div>
<script src="JS/index.js" defer></script>
<script src="JS/widget_loader.js" defer></script>
<script src="JS/balance_enquiry.js"></script>
</body>

</html>
