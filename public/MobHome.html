<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Mobile Home</title>
    <link rel="stylesheet" href="CSS/MobHome.css">
</head>

<body>
    <div class="mobile-container">
        <header class="header">
            <div class="header-left"></div>
            <div class="header-right">
                <button onclick="logout()" class="logout-link">Logout</button>
            </div>
        </header>

        <section class="welcome">
            <h1>Hello, <span id="userName">User</span>!</h1>
        </section>

        <div class="quick-actions-card">
            <div class="action-item">
                <div class="icon-box">💰</div>
                <span>PayNow</span>
            </div>
            <div class="action-item">
                <div class="icon-box">📷</div>
                <span>Scan & Pay</span>
            </div>
            <div class="action-item">
                <div class="icon-box">💱</div>
                <span>Foreign Exchange</span>
            </div>
            <div class="divider"></div>
            <div class="action-item">
                <div class="icon-box-grey">⚙️</div>
                <span>Customise</span>
            </div>
        </div>

        <div class="account-slider-container">
            <div class="account-slider" id="accountSlider">
                <div class="loading-spinner">Loading accounts...</div>
            </div>
        </div>

        <div class="content-card" id="cardContentBox">
            <div id="emptyState">
                <div class="grey-img-placeholder">💳</div>
                <p id="placeholderText">Select an account to see your cards</p>
            </div>

            <div id="cardList" style="display: none;">
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item active">🏠<span>Home</span></div>
            <div class="nav-item">🌱<span>Plan</span></div>
            <div class="nav-item">🔄<span>Pay & Transfer</span></div>
            <div class="nav-item">🎁<span>Rewards</span></div>
            <div class="nav-item">⣿<span>More</span></div>
        </nav>
    </div>

    <!-- Authentication Approval Modal -->
    <div id="auth-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-icon">🔓</div>
                <h2>Login Request</h2>
            </div>
            <div class="modal-body">
                <p>A login request was received from <strong id="modal-station-id">ATM01</strong>.</p>
                <p>Do you approve this login?</p>
            </div>
            <div class="modal-footer">
                <button id="auth-deny" class="btn-secondary">Deny</button>
                <button id="auth-approve" class="btn-primary">Approve</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>

    <script src="JS/MobHome.js"></script>
</body>

</html>
