<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - 24/7 ATM</title>
    <link rel="stylesheet" type="text/css" href="CSS/index.css">
    <link rel="stylesheet" type="text/css" href="CSS/TransactionHistory.css">
</head>

<body>
    <div class="atm-container">
        <div class="top-links">
            <a href="NewHomePage.html" class="top-link">Back to Home</a>
            <span class="top-separator">|</span>
            <a href="TransactionCancel.html" class="top-link">Exit</a>
        </div>

        <div class="history-wrapper">
            <div class="history-header">
                <h1>Transaction History</h1>
                <p id="account-display">Account No: **** 1234</p>
            </div>

            <div class="history-container">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Type</th>
                            <th>Reference</th>
                            <th class="text-right">Amount (SGD)</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Transactions will be loaded here -->
                    </tbody>
                </table>
                <div id="no-history" class="hidden">
                    <p>No transactions found for this account.</p>
                </div>
            </div>

            <div class="action-buttons">
                <button onclick="window.location.href='NewHomePage.html'" class="btn-primary">Back to Menu</button>
            </div>
        </div>
    </div>

    <script src="JS/transaction_history.js"></script>
</body>

</html>
