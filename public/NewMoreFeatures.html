<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM More Features Screen</title>
    <link rel="stylesheet" type="text/css" href="CSS/index.css">
    <link rel="stylesheet" type="text/css" href="CSS/chat.css">
    <link rel="stylesheet" type="text/css" href="CSS/NewMoreFeatures.css">
</head>
<body>
    <div class="atm-container">
        <!-- TOP RIGHT LINKS -->
        <div class="top-links">
            <a href="#" class="top-link" id="language-toggle">ENG</a>
            <span class="top-separator">|</span>
            <a href="#" class="top-link" id="exit" translateRef="exitLink">Exit</a>
        </div>
        
        <main class="main-content">
            <h1 class="greeting" translateRef="menuGreeting">
                Hello!<br>
                What would you like to do today?
            </h1>

            <h2 class="section-title" translateRef="moreFeaturesSectionTitle">More Features</h2>

            <div class="features-grid">
                
                <button class="feature-box" onclick="location.href='BalanceEnquiry.html'">
                    <span class="icon">$</span>
                    <span class="feature-text" translateRef="balanceEnquiryFeature">Balance<br>Enquiry</span>
                </button>
                
                <button class="feature-box" onclick="location.href='TransactionHistory.html'">
                    <span class="icon">📜</span>
                    <span class="feature-text" translateRef="transactionHistoryCard">Transaction<br>History</span>
                </button>
                
                <button class="feature-box" onclick="location.href='OverseaTransfer.html'">
                    <span class="icon">☰</span>
                    <span class="feature-text" translateRef="overseasTransferFeature"><a href="OverseaTransfer.html">Overseas<br>transfer</a></span>
                </button>
                
                <button class="feature-box">
                    <span class="icon">🔑</span>
                    <span class="feature-text" translateRef="cpfServicesFeature">CPF<br>Services</span>
                </button>
                
                <button class="feature-box">
                    <span class="icon">📈</span>
                    <span class="feature-text" translateRef="investmentServicesFeature">Investment<br>Services</span>
                </button>
                
                <button class="feature-box">
                    <span class="icon">⇄</span>

                    <span class="feature-text" translateRef="transferFundsFeature">Transfer<br>Funds</span>
                </button>
            </div>
        </main>

        <a href="NewHomePage.html" class="back-btn" aria-label="Back">&larr;</a>

        <div id="chat-toggle" class="chat-icon">
            <span  class="icon-bubble">💬</span>
        </div>
        
        <div id="chat-root"></div>
        
    </div>
<script src="JS/index.js" defer></script> 
<script src="JS/widget_loader.js" defer></script>
</body>
</html>
