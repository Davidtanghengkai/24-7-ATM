<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Account</title>
    <link rel="stylesheet" type="text/css" href="CSS/index.css">
    <link rel="stylesheet" type="text/css" href="CSS/chat.css">
    <link rel="stylesheet" type="text/css" href="CSS/selectAccount.css">
</head>
<body>
     <div class="atm-container">
        <!-- Top Right -->
        <div class="top-links">
            <a href="#" class="top-link" id="language-toggle">Eng</a>
            <span class="top-separator">|</span>
            <a href="TransactionCancel.html" class="top-link" translateRef="exitLink" >Exit</a>
        </div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <h1 class="page-title">Select Account</h1>

            <div class="account-container" id="account-container">
                <!-- JS will load accounts here -->
            </div>
        </main>

        <a href="NewHomePage.html" class="back-btn" aria-label="Back">&larr;</a>

        <div id="chat-toggle" class="chat-icon">
            <span  class="icon-bubble">💬</span>
        </div>

        <div id="chat-root"></div>

        <!-- PIN Modal -->
        <div class="pin-modal-overlay" id="pin-modal">
            <div class="pin-modal-content">
                <h2>Create Card PIN</h2>
                <input type="password" id="new-card-pin" maxlength="6" placeholder="6-digit PIN" required>

                <h2>Card Description</h2>
                <input type="text" id="card-description" maxlength="25" placeholder="E.g., My Travel Card" required>
                <button id="createCard">Create Card</button>
            </div>
        </div>
    </div>
<script src="JS/index.js"></script>
<script src="JS/widget_loader.js" defer></script>
<script src="JS/selectAccount.js"></script>
</body>
</html>
